name: material_symbols_icons_flow
description: Flow fork of material_symbols_icons — Google Material Symbols icons, patched for Flutter's final IconData. Tracks upstream.
maintainer: Tim Maffett
version: 4.2928.1
homepage: https://github.com/flow-mn/material_symbols_icons_flow
repository: https://github.com/flow-mn/material_symbols_icons_flow
issue_tracker: https://github.com/flow-mn/material_symbols_icons_flow/issues
screenshots:
  - description: 'example flutter material symbols icon browser'
    path: media/example.png
  - description: 'google material symbols icon browser'
    path: media/google_icon_fonts.png

topics:
  - icon
  - icons
  - material
  - material-symbols
  - material-symbols-icons

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.7.0'

dependencies:
  flutter:
    sdk: flutter
  
dev_dependencies:
  flutter_lints: ^5.0.0
  http: ^1.3.0
  args: ^2.6.0
  path: ^1.9.0
  chalkdart: ^3.0.4
  glob: ^2.1.2

flutter:
  fonts:
    - family: MaterialSymbolsOutlined
      fonts:
       - asset: lib/fonts/MaterialSymbolsOutlined.ttf
       
    - family: MaterialSymbolsRounded
      fonts:
       - asset: lib/fonts/MaterialSymbolsRounded.ttf
       
    - family: MaterialSymbolsSharp
      fonts:
       - asset: lib/fonts/MaterialSymbolsSharp.ttf


